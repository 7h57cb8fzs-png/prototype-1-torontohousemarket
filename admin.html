<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THM Lead Operations</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-agents.css"></head><body>
<header><div><strong>THM</strong><span>Lead operations</span></div><button id="refresh">Refresh</button></header>
<main><section id="login"><h1>Open lead operations</h1><p>Enter the admin API key configured in Cloudflare. It stays in this browser tab only.</p><form id="loginForm"><input id="key" type="password" autocomplete="off" placeholder="Admin API key" required><button>Open dashboard</button></form><p id="error"></p></section>
<section id="dashboard" hidden><nav class="tabs"><button class="tab active" data-view="leadsView">Leads</button><button class="tab" data-view="agentsView">Agents</button></nav><section id="leadsView"><div id="stats" class="stats"></div><div class="toolbar"><h1>Recent leads</h1><span id="updated"></span></div><div id="leads" class="leads"></div></section><section id="agentsView" hidden><div class="toolbar"><div><h1>Agents</h1><p>Manage round-robin membership and notification destinations.</p></div><button id="addAgent">Add agent</button></div><form id="agentForm" class="agent-form" hidden><h2 id="agentFormTitle">Add agent</h2><input id="agentId" type="hidden"><label>Name<input id="agentName" required maxlength="120"></label><label>Email<input id="agentEmail" type="email" maxlength="254"></label><label>Mobile<input id="agentMobile" maxlength="50"></label><label class="order-field">Assignment order<input id="agentOrder" type="number" min="1"></label><label class="check"><input id="agentActive" type="checkbox" checked> Active in round robin</label><div><button type="submit">Save agent</button><button id="cancelAgent" class="secondary" type="button">Cancel</button></div><p id="agentError"></p></form><div id="agents" class="agents"></div></section></section></main><script src="/admin.js" defer></script></body></html>
