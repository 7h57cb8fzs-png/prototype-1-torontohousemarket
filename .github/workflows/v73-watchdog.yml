name: V7.3 Report Watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Recover only genuinely stale report jobs
        env:
          SUPABASE_URL: https://pwbtxyavjjotxtvegrqe.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Database-side recovery function already contains the queue's ownership guards.
          curl -fsS --max-time 20 "$SUPABASE_URL/rest/v1/rpc/recover_stale_report_jobs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}' || true
