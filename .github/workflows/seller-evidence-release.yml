name: Publish verified seller evidence
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[seller-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate focused seller release
        run: |
          node --check worker-v11.js
          node --check seller.js
          node --check form-inputs.js
          node --check address-input.js
          node --check app.js
          node --check admin.js
          node --test tests/seller-flow.test.mjs tests/email-copy.test.mjs tests/address-search.test.mjs tests/form-validation.test.mjs tests/address-autocomplete.test.mjs
      - name: Publish the verified preview with rollback protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: 384c6bbdad50dda64bb1319cee8e2318c4aacdde324bffe0ec56bcbecc59c3c8
          CANDIDATE_VERSION_ID: 261982d4-544f-4edf-9164-466164cb25b9
        run: node .github/scripts/promote-buyer-tools.mjs
