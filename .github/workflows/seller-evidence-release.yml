name: Publish verified seller evidence
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[seller-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate focused seller release
        run: |
          node --check worker-v11.js
          node --check seller.js
          node --check form-inputs.js
          node --check app.js
          node --check admin.js
          node --test tests/seller-flow.test.mjs tests/email-copy.test.mjs tests/address-search.test.mjs tests/form-validation.test.mjs
      - name: Publish the verified preview with rollback protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: 871df70ace83b34fefbf43f7f0ddffb22f6f5a31b6740f12bd9de8dc3fa2b050
          CANDIDATE_VERSION_ID: 01af3042-e708-4e5d-a68b-a0c78dcac46d
        run: node .github/scripts/promote-buyer-tools.mjs
