name: Publish verified seller evidence
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[seller-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate focused seller release
        run: |
          node --check worker-v11.js
          node --check seller.js
          node --check admin.js
          node --test tests/seller-flow.test.mjs tests/email-copy.test.mjs
      - name: Publish the verified preview with rollback protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: 7b2fd318de7863416865c7f95a75829d0006a5189f80c22522e51e1ec4afd119
          CANDIDATE_VERSION_ID: 01a877b8-24fd-4616-8b7c-caacc868f42f
        run: node .github/scripts/promote-buyer-tools.mjs
