name: Promote verified buyer tools with rollback
on:
  push:
    branches: [fix/vow-comparable-engine]
    paths:
      - worker-v11.js
      - app.js
      - index.html
      - styles.css
      - wrangler.jsonc
      - tests/**
      - .github/workflows/deploy-vow-comparable-fix.yml
      - .github/scripts/promote-buyer-tools.mjs
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete release
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Promote the tested Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: 0c29ea238668e96591018142bfcaa771fbac3c49f48240d5db7759d5f25f6a42
          CANDIDATE_VERSION_ID: e71199cb-136e-45af-a1db-9dbef934f088
        run: node .github/scripts/promote-buyer-tools.mjs
