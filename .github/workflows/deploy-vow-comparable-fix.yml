name: Deploy guarded VOW comparable fix
# Retry only after the complete verified Worker source is present on the branch.

on:
  push:
    branches:
      - fix/vow-comparable-engine
    paths:
      - .github/workflows/deploy-vow-comparable-fix.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited source
        uses: actions/checkout@v4
        with:
          ref: fix/vow-comparable-engine

      - name: Validate comparable engine
        run: |
          set -euo pipefail
          node --check worker-v11.js
          node --test tests/comparable-engine.test.mjs
          test "$(sha256sum worker-v11.js | cut -d' ' -f1)" = "8f32c4f4e9f36b20d27aa26ca3c039646beb0c546861fb7109492656412d5ff8"

      - name: Deploy with source guard and automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          WORKER_NAME: prototype-1-torontohousemarket
          PRODUCTION_URL: https://torontohousemarket.com
          EXPECTED_BEFORE_SHA: 988b9f29ec663ac023b2ef1e8a96f66c6098818040056fc14e8c275a31a32524
          EXPECTED_AFTER_SHA: 8f32c4f4e9f36b20d27aa26ca3c039646beb0c546861fb7109492656412d5ff8
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS -H "${auth}" -o "${work_dir}/deployments-before.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
          rollback_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-before.json" | head -1)"
          test -n "${rollback_id}"
          test "${rollback_id}" != "null"

          curl -fsS -H "${auth}" -o "${work_dir}/version-before.json" "${api}/workers/workers/${WORKER_NAME}/versions/${rollback_id}?include=modules"
          jq -r '.result.modules[] | select(.name == "worker-v11.js") | .content_base64' "${work_dir}/version-before.json" | base64 --decode > "${work_dir}/worker-before.js"
          actual_before_sha="$(sha256sum "${work_dir}/worker-before.js" | cut -d' ' -f1)"
          echo "Active source SHA-256: ${actual_before_sha}"
          test "${actual_before_sha}" = "${EXPECTED_BEFORE_SHA}"

          curl -fsS -H "${auth}" -o "${work_dir}/settings-before.json" "${api}/workers/scripts/${WORKER_NAME}/settings"
          jq -e '.success == true' "${work_dir}/settings-before.json" >/dev/null
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' "${work_dir}/version-before.json" > "${work_dir}/bindings-before.json"
          curl -sS -H "${auth}" -o "${work_dir}/schedules-before.json" "${api}/workers/scripts/${WORKER_NAME}/schedules" || true

          rollback() {
            jq -n --arg version_id "${rollback_id}" '{strategy:"percentage",versions:[{percentage:100,version_id:$version_id}],annotations:{"workers/message":"Automatic rollback after comparable-fix verification failure"}}' > "${work_dir}/rollback.json"
            curl -sS --request POST -H "${auth}" -H 'Content-Type: application/json' --data-binary @"${work_dir}/rollback.json" "${api}/workers/scripts/${WORKER_NAME}/deployments" >/dev/null || true
          }
          trap 'status=$?; if [ "${status}" -ne 0 ]; then rollback; fi; rm -rf "${work_dir}"' EXIT

          http_status="$(curl -sS --request PUT -H "${auth}" -H 'CF-WORKER-MAIN-MODULE-PART: worker-v11.js' -F 'metadata={"main_module":"worker-v11.js"};type=application/json' -F 'worker-v11.js=@worker-v11.js;type=application/javascript+module' -o "${work_dir}/content-response.json" -w '%{http_code}' "${api}/workers/scripts/${WORKER_NAME}/content")"
          test "${http_status}" -ge 200
          test "${http_status}" -lt 300

          curl -fsS -H "${auth}" -o "${work_dir}/deployments-mid.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
          temporary_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-mid.json" | head -1)"
          curl -fsS -H "${auth}" -o "${work_dir}/version-mid.json" "${api}/workers/workers/${WORKER_NAME}/versions/${temporary_id}"
          jq -S '[.result.bindings[] | select(.type != "plain_text" and .type != "json") | {name, type}] | sort_by(.name)' "${work_dir}/version-before.json" > "${work_dir}/protected-before.json"
          jq -S '[.result.bindings[] | select(.type != "plain_text" and .type != "json") | {name, type}] | sort_by(.name)' "${work_dir}/version-mid.json" > "${work_dir}/protected-mid.json"
          cmp "${work_dir}/protected-before.json" "${work_dir}/protected-mid.json"

          jq '
            .result as $s |
            {
              annotations:{"workers/message":"Stage 4 local-first VOW comparable fix","workers/tag":"stage4-vow-local-first-20260905"},
              bindings:[inputs.result.bindings[] | if (.type == "plain_text" or .type == "json") then . else {name:.name,type:"inherit",version_id:"latest"} end],
              compatibility_date:$s.compatibility_date,
              compatibility_flags:($s.compatibility_flags // []),
              usage_model:$s.usage_model,
              limits:$s.limits,
              observability:$s.observability,
              placement:$s.placement,
              cache_options:$s.cache_options,
              tail_consumers:$s.tail_consumers,
              logpush:$s.logpush
            } | with_entries(select(.value != null))
          ' "${work_dir}/settings-before.json" "${work_dir}/version-before.json" > "${work_dir}/settings-patch.json"
          settings_status="$(curl -sS --request PATCH -H "${auth}" -F 'settings=@'"${work_dir}"'/settings-patch.json;type=application/json' -o "${work_dir}/settings-response.json" -w '%{http_code}' "${api}/workers/scripts/${WORKER_NAME}/settings")"
          test "${settings_status}" -ge 200
          test "${settings_status}" -lt 300
          jq -e '.success == true' "${work_dir}/settings-response.json" >/dev/null

          active_id="${rollback_id}"
          for attempt in 1 2 3 4 5; do
            curl -fsS -H "${auth}" -o "${work_dir}/deployments-after.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
            active_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-after.json" | head -1)"
            if [ -n "${active_id}" ] && [ "${active_id}" != "${rollback_id}" ]; then break; fi
            sleep 2
          done
          test "${active_id}" != "${rollback_id}"
          curl -fsS -H "${auth}" -o "${work_dir}/version-after.json" "${api}/workers/workers/${WORKER_NAME}/versions/${active_id}?include=modules"
          jq -r '.result.modules[] | select(.name == "worker-v11.js") | .content_base64' "${work_dir}/version-after.json" | base64 --decode > "${work_dir}/worker-after.js"
          test "$(sha256sum "${work_dir}/worker-after.js" | cut -d' ' -f1)" = "${EXPECTED_AFTER_SHA}"
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' "${work_dir}/version-after.json" > "${work_dir}/bindings-after.json"
          cmp "${work_dir}/bindings-before.json" "${work_dir}/bindings-after.json"

          curl -sS -H "${auth}" -o "${work_dir}/schedules-after.json" "${api}/workers/scripts/${WORKER_NAME}/schedules" || true
          if jq -e '.success == true' "${work_dir}/schedules-before.json" >/dev/null 2>&1 && jq -e '.success == true' "${work_dir}/schedules-after.json" >/dev/null 2>&1; then
            diff -u <(jq -S '.result' "${work_dir}/schedules-before.json") <(jq -S '.result' "${work_dir}/schedules-after.json")
          fi
          curl -fsS "${PRODUCTION_URL}/api/version" | jq -e '.ok == true and .vowAccess == true' >/dev/null
          curl -fsS "${PRODUCTION_URL}/" -o "${work_dir}/home.html"
          test "$(wc -c < "${work_dir}/home.html")" -gt 1000

          trap - EXIT
          rm -rf "${work_dir}"
