name: Promote verified buyer tools with rollback
on:
  push:
    branches: [fix/vow-comparable-engine]
    paths:
      - worker-v11.js
      - app.js
      - index.html
      - styles.css
      - wrangler.jsonc
      - tests/**
      - .github/workflows/deploy-vow-comparable-fix.yml
      - .github/scripts/promote-buyer-tools.mjs
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete release
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Promote the tested Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: b8f05b41f3e442b7b1fdfcf3ef065957e0afab490af9d2e14e9cae2f24ce609c
          CANDIDATE_VERSION_ID: 03c5b5ae-30c1-40f4-a72a-16d5332de9b8
        run: node .github/scripts/promote-buyer-tools.mjs
