name: Promote verified buyer tools with rollback
on:
  push:
    branches: [fix/vow-comparable-engine]
    paths:
      - worker-v11.js
      - app.js
      - index.html
      - styles.css
      - wrangler.jsonc
      - tests/**
      - .github/workflows/deploy-vow-comparable-fix.yml
      - .github/scripts/promote-buyer-tools.mjs
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete release
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Promote the tested Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: 3c9d8056ece4928e515cc43c463c71650dde30c3642d05ed40a547dd42b89f11
          CANDIDATE_VERSION_ID: 56bd1416-be52-4174-b52b-5690003833ff
        run: node .github/scripts/promote-buyer-tools.mjs
