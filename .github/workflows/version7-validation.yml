name: Version 7.1 validation

on:
  push:
    branches: [main, phase-7-1]
    paths:
      - 'worker-v11.js'
      - 'worker-v12.js'
      - 'worker-v13.js'
      - 'worker-v14.js'
      - 'worker-v15.js'
      - 'wrangler.jsonc'
      - '.github/workflows/version7-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Version 7.1 worker syntax and model policy
        run: |
          set -euo pipefail
          node --check worker-v11.js
          node --check worker-v12.js
          node --check worker-v13.js
          node --check worker-v14.js
          node --check worker-v15.js
          grep -F 'version-7.1-luna-seller-routing-20260916' worker-v15.js >/dev/null
          grep -F 'gpt-5.6-luna' worker-v15.js >/dev/null
          grep -F 'worker-v15.js' wrangler.jsonc >/dev/null
          echo 'Version 7.1 syntax, Luna lock, and seller-routing markers passed.'
