name: Deploy Toronto House Market Version 7.3
on:
  push:
    branches: [main]
    paths: ['worker-v20.js','worker-v21.js','wrangler.jsonc','address-input.js','seller.html','seller.js','seller.css','.github/workflows/deploy-version72.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V7.3
        run: |
          set -euo pipefail
          node --check worker-v20.js
          node --check worker-v21.js
          node --check address-input.js
          node --check seller.js
          grep -F '"main":"worker-v21.js"' wrangler.jsonc >/dev/null
          grep -F '"THM_RELEASE":"7.3"' wrangler.jsonc >/dev/null
          grep -F 'sellerRenovation' seller.html >/dev/null
          grep -F 'renovationPct' seller.js >/dev/null
      - name: Prepare deploy config
        run: |
          node <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); delete c.secrets; fs.writeFileSync('wrangler.deploy.json',JSON.stringify(c,null,2));
          NODE
      - name: Deploy V7.3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.deploy.json
      - name: Verify live domain
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o version.json -w '%{http_code}' --max-time 20 https://torontohousemarket.com/api/version || true)
            if [ "$code" = "200" ] && grep -F 'version-7.3-native-renovation-address-20260917' version.json >/dev/null 2>&1; then
              curl -fsS --max-time 20 https://torontohousemarket.com/seller.html -o seller-live.html
              grep -F 'sellerRenovation' seller-live.html >/dev/null
              cat version.json
              exit 0
            fi
            sleep 5
          done
          echo '::warning::Cloudflare deployment succeeded but custom-domain marker was not confirmed from the GitHub runner.'
          cat version.json 2>/dev/null || true
          exit 0
