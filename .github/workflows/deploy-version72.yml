name: Deploy Toronto House Market Version 7.3
on:
  push:
    branches: [main]
    paths: ['worker-v20.js','wrangler.jsonc','address-input.js','seller.html','seller.js','seller.css','.github/workflows/deploy-version72.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V7.3
        run: |
          set -euo pipefail
          node --check worker-v20.js
          node --check address-input.js
          node --check seller.js
          grep -F '"THM_RELEASE":"7.3"' wrangler.jsonc >/dev/null
          grep -F 'sellerRenovation' seller.html >/dev/null
          grep -F 'renovationPct' seller.js >/dev/null
      - name: Prepare deploy config
        run: |
          node <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); delete c.secrets; fs.writeFileSync('wrangler.deploy.json',JSON.stringify(c,null,2));
          NODE
      - name: Deploy V7.3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.deploy.json
      - name: Verify deployed Worker V7.3
        run: |
          set -euo pipefail
          WORKER='https://prototype-1-torontohousemarket.7h57cb8fzs.workers.dev'
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 "$WORKER/api/version" -o version.json || true
            if grep -F 'version-7.3-native-renovation-address-20260917' version.json >/dev/null 2>&1; then
              curl -fsS --max-time 20 "$WORKER/seller.html" -o seller-live.html
              curl -fsS --max-time 20 "$WORKER/address-input.js" -o address-live.js
              grep -F 'sellerRenovation' seller-live.html >/dev/null
              grep -F 'Unit ${parsed.unit} will be kept' address-live.js >/dev/null
              cat version.json
              exit 0
            fi
            sleep 4
          done
          cat version.json 2>/dev/null || true
          exit 1
      - name: Check custom domain routing
        run: |
          set -euo pipefail
          code=$(curl -sS -o domain.json -w '%{http_code}' --max-time 20 https://torontohousemarket.com/api/version || true)
          echo "torontohousemarket.com HTTP $code"
          cat domain.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo '::warning::V7.3 is deployed to the Worker, but the custom domain is not routing /api/version to this Worker. Check the Cloudflare custom-domain/route binding.'
          elif ! grep -F 'version-7.3-native-renovation-address-20260917' domain.json >/dev/null; then
            echo '::warning::Custom domain is serving a different Worker/version. Check Cloudflare custom-domain/route binding.'
          fi
