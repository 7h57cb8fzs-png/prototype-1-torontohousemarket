name: Deploy Toronto House Market Version 7.2
on:
  push:
    branches: [main]
    paths: ['worker-v20.js','wrangler.jsonc','.github/workflows/deploy-version72.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V7.2
        run: |
          set -euo pipefail
          node --check worker-v20.js
          grep -F 'worker-v20.js' wrangler.jsonc >/dev/null
      - name: Prepare deploy config
        run: |
          node <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); delete c.secrets; fs.writeFileSync('wrangler.deploy.json',JSON.stringify(c,null,2));
          NODE
      - name: Deploy V7.2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.deploy.json
      - name: Verify live marker
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 https://torontohousemarket.com/api/version -o version.json || true
            if grep -F 'version-7.2-evidence-first-20260917' version.json >/dev/null 2>&1; then cat version.json; exit 0; fi
            sleep 5
          done
          cat version.json 2>/dev/null || true
          exit 1
