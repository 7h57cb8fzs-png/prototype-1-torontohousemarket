name: Deploy v93 with exact binding restore and rollback

on:
  push:
    branches:
      - codex/fix-complete-ai-report
    paths:
      - .github/workflows/deploy-cloudflare-v85-code-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified v93 source
        uses: actions/checkout@v4
        with:
          ref: codex/fix-complete-ai-report

      - name: Validate source
        run: |
          set -euo pipefail
          node --check worker-v11.js
          grep -F 'stage4-entry-window-vow-comparables-v93-20260903' worker-v11.js >/dev/null
          grep -F 'querySoldComparableRows' worker-v11.js >/dev/null

      - name: Deploy code, restore exact settings, and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          WORKER_NAME: prototype-1-torontohousemarket
          PRODUCTION_URL: https://torontohousemarket.com
        run: |
          set -euo pipefail
          mkdir -p cloudflare-v93-deploy
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/deployments-before.json "${api}/workers/scripts/${WORKER_NAME}/deployments"
          rollback_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' cloudflare-v93-deploy/deployments-before.json | head -1)"
          if [ -z "${rollback_id}" ] || [ "${rollback_id}" = "null" ]; then
            echo "::error::No active rollback version was found."
            exit 1
          fi
          curl -fsS "${PRODUCTION_URL}/api/version" -o cloudflare-v93-deploy/production-version-before.json
          jq -e '.version == "stage4-fast-recent-vow-comparables-v92-20260903" and .vowAccess == true' cloudflare-v93-deploy/production-version-before.json >/dev/null
          printf '%s' "${rollback_id}" > cloudflare-v93-deploy/rollback-version-id.txt

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/version-before.json "${api}/workers/workers/${WORKER_NAME}/versions/${rollback_id}"
          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/settings-before.json "${api}/workers/scripts/${WORKER_NAME}/settings"
          jq -e '.success == true' cloudflare-v93-deploy/settings-before.json >/dev/null

          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' cloudflare-v93-deploy/version-before.json > cloudflare-v93-deploy/bindings-before.json
          jq -r '.result.bindings[] | select(.type == "plain_text") | .name' cloudflare-v93-deploy/version-before.json | sort > cloudflare-v93-deploy/plain-bindings-before.txt
          test "$(wc -l < cloudflare-v93-deploy/plain-bindings-before.txt)" -eq 11

          curl -sS -H "${auth}" -o cloudflare-v93-deploy/schedules-before.json "${api}/workers/scripts/${WORKER_NAME}/schedules" || true

          rollback() {
            echo "::warning::Production verification failed; restoring ${rollback_id}."
            jq -n --arg version_id "${rollback_id}" '{
              strategy: "percentage",
              versions: [{percentage: 100, version_id: $version_id}],
              annotations: {"workers/message": "Automatic rollback after v93 verification failure"}
            }' > cloudflare-v93-deploy/rollback-request.json
            curl -sS --request POST -H "${auth}" -H 'Content-Type: application/json' \
              --data-binary @cloudflare-v93-deploy/rollback-request.json \
              -o cloudflare-v93-deploy/rollback-response.json \
              "${api}/workers/scripts/${WORKER_NAME}/deployments" || true
          }
          trap 'status=$?; if [ "${status}" -ne 0 ]; then rollback; fi' EXIT

          http_status="$(curl -sS --request PUT \
            -H "${auth}" \
            -H 'CF-WORKER-MAIN-MODULE-PART: worker-v11.js' \
            -F 'metadata={"main_module":"worker-v11.js"};type=application/json' \
            -F 'worker-v11.js=@worker-v11.js;type=application/javascript+module' \
            -o cloudflare-v93-deploy/content-update.json \
            -w '%{http_code}' \
            "${api}/workers/scripts/${WORKER_NAME}/content")"
          printf '%s' "${http_status}" > cloudflare-v93-deploy/content-update-http-status.txt
          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            jq -r '.errors[]? | "::error::Cloudflare \(.code): \(.message)"' cloudflare-v93-deploy/content-update.json
            exit 1
          fi

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/deployments-mid.json "${api}/workers/scripts/${WORKER_NAME}/deployments"
          temporary_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' cloudflare-v93-deploy/deployments-mid.json | head -1)"
          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/version-mid.json "${api}/workers/workers/${WORKER_NAME}/versions/${temporary_id}"
          jq -S '[.result.bindings[] | select(.type != "plain_text") | {name, type}] | sort_by(.name)' cloudflare-v93-deploy/version-before.json > cloudflare-v93-deploy/protected-bindings-before.json
          jq -S '[.result.bindings[] | select(.type != "plain_text") | {name, type}] | sort_by(.name)' cloudflare-v93-deploy/version-mid.json > cloudflare-v93-deploy/protected-bindings-mid.json
          cmp cloudflare-v93-deploy/protected-bindings-before.json cloudflare-v93-deploy/protected-bindings-mid.json

          jq --arg rollback_id "${rollback_id}" '
            .result as $s |
            {
              annotations: {
                "workers/message": "Stage 4 sold-query comparables v93",
                "workers/tag": "stage4-entry-window-vow-comparables-v93-20260903"
              },
              bindings: [
                inputs.result.bindings[] |
                if (.type == "plain_text" or .type == "json") then .
                else {name: .name, type: "inherit", version_id: "latest"}
                end
              ],
              compatibility_date: $s.compatibility_date,
              compatibility_flags: ($s.compatibility_flags // []),
              usage_model: $s.usage_model,
              limits: $s.limits,
              observability: $s.observability,
              placement: $s.placement,
              cache_options: $s.cache_options,
              tail_consumers: $s.tail_consumers,
              logpush: $s.logpush
            } |
            with_entries(select(.value != null))
          ' cloudflare-v93-deploy/settings-before.json cloudflare-v93-deploy/version-before.json > cloudflare-v93-deploy/settings-patch.json

          settings_status="$(curl -sS --request PATCH \
            -H "${auth}" \
            -F 'settings=@cloudflare-v93-deploy/settings-patch.json;type=application/json' \
            -o cloudflare-v93-deploy/settings-patch-response.json \
            -w '%{http_code}' \
            "${api}/workers/scripts/${WORKER_NAME}/settings")"
          printf '%s' "${settings_status}" > cloudflare-v93-deploy/settings-patch-http-status.txt
          if [ "${settings_status}" -lt 200 ] || [ "${settings_status}" -ge 300 ]; then
            jq -r '.errors[]? | "::error::Cloudflare \(.code): \(.message)"' cloudflare-v93-deploy/settings-patch-response.json
            exit 1
          fi
          jq -e '.success == true' cloudflare-v93-deploy/settings-patch-response.json >/dev/null

          for attempt in {1..15}; do
            if curl -fsS "${PRODUCTION_URL}/api/version" -o cloudflare-v93-deploy/production-version.json &&
               jq -e '.version == "stage4-entry-window-vow-comparables-v93-20260903"' cloudflare-v93-deploy/production-version.json >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 15 ]; then
              echo "::error::Production did not report v93."
              exit 1
            fi
            sleep 2
          done

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/deployments-after.json "${api}/workers/scripts/${WORKER_NAME}/deployments"
          active_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' cloudflare-v93-deploy/deployments-after.json | head -1)"
          printf '%s' "${active_id}" > cloudflare-v93-deploy/active-version-id.txt
          test -n "${active_id}"
          test "${active_id}" != "${rollback_id}"

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/version-after.json "${api}/workers/workers/${WORKER_NAME}/versions/${active_id}"
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' cloudflare-v93-deploy/version-after.json > cloudflare-v93-deploy/bindings-after.json
          cmp cloudflare-v93-deploy/bindings-before.json cloudflare-v93-deploy/bindings-after.json

          curl -fsS -H "${auth}" -o cloudflare-v93-deploy/settings-after.json "${api}/workers/scripts/${WORKER_NAME}/settings"

          curl -sS -H "${auth}" -o cloudflare-v93-deploy/schedules-after.json "${api}/workers/scripts/${WORKER_NAME}/schedules" || true
          if jq -e '.success == true' cloudflare-v93-deploy/schedules-before.json >/dev/null 2>&1 &&
             jq -e '.success == true' cloudflare-v93-deploy/schedules-after.json >/dev/null 2>&1; then
            jq -S '.result' cloudflare-v93-deploy/schedules-before.json > cloudflare-v93-deploy/schedules-before-normalized.json
            jq -S '.result' cloudflare-v93-deploy/schedules-after.json > cloudflare-v93-deploy/schedules-after-normalized.json
            cmp cloudflare-v93-deploy/schedules-before-normalized.json cloudflare-v93-deploy/schedules-after-normalized.json
          fi

          curl -fsS "${PRODUCTION_URL}/" -o cloudflare-v93-deploy/production-home.html
          test "$(wc -c < cloudflare-v93-deploy/production-home.html)" -gt 1000
          curl -fsS "${PRODUCTION_URL}/api/health" -o cloudflare-v93-deploy/production-health.json || true

          trap - EXIT
          echo "Production v93 verified with exact bindings. Rollback version remains ${rollback_id}."

      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-v93-exact-binding-deployment
          path: cloudflare-v93-deploy/
          if-no-files-found: error
          retention-days: 7
