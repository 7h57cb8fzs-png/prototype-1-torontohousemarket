name: Verify and publish two seller checkboxes
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-v75-style-guarded-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[consent-fix-preview]') || contains(github.event.head_commit.message, '[consent-fix-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard the isolated change scope
        run: node scripts/seller-consent-scope.mjs
      - name: Run exactly five focused seller form tests
        if: contains(github.event.head_commit.message, '[consent-fix-preview]')
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps webkit
          node --test tests/seller-consent.test.mjs
      - name: Prepare or publish the verified version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_VERSION: 0666a0bf-3900-445b-b57d-97ed18673402
          EXPECTED_ACTIVE_SHA: 5ad6140a8c9d4aad9587c408ab3209adf107bf90615fe0dd4dfb3cec7e3256b7
          CANDIDATE_VERSION_ID: 'bef45e90-5003-4ff7-a051-4d722102b909'
          EXPECTED_CANDIDATE_SHA: '5ad6140a8c9d4aad9587c408ab3209adf107bf90615fe0dd4dfb3cec7e3256b7'
          PUBLISH: ${{ contains(github.event.head_commit.message, '[consent-fix-release]') && 'true' || 'false' }}
        run: node scripts/seller-consent-release.mjs
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[consent-fix-preview]')
        with:
          name: seller-two-checkbox-review
          path: mobile-qa/
