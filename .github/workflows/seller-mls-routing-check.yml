name: Verify Seller candidate with public preview routing
on:
  push:
    branches: [fix/seller-mls-only-20260926]
    paths: [.github/workflows/seller-mls-routing-check.yml]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix adapter-only same-zone routing and preserve public admin authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/seller-mls-release.mjs');s=p.read_text()
          old="c.main='worker-seller-mls-acceptance.js';c.vars={...plain,THM_SELLER_QA_NONCE:nonce};"
          new="c.main='worker-seller-mls-acceptance.js';c.compatibility_flags=[...new Set([...(c.compatibility_flags||[]),'global_fetch_strictly_public'])];c.vars={...plain,THM_SELLER_QA_NONCE:nonce};"
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace('if(!configuredAdmin){','if(!configuredAdmin && process.env.PUBLISH!==\'true\'){')
          p.write_text(s)
          PY
          node --check scripts/seller-mls-release.mjs
          node scripts/seller-mls-scope.mjs
          git config user.name 'THM Release Checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/seller-mls-release.mjs
          git commit -m 'Use documented public fetch routing in expiring QA adapter; no production flag change'
          git push origin HEAD:fix/seller-mls-only-20260926
      - name: Verify candidate assets and four read-only Seller results
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          EXPECTED_ACTIVE_VERSION: b696da17-c413-425b-9d22-fa783ecd5a0c
          EXPECTED_ACTIVE_SHA: 109ef1b69e491c95f1ad57cf591b95a0246174327fb26edbdbea088a6bb16744
          PUBLISH: 'false'
        run: node scripts/seller-mls-release.mjs
