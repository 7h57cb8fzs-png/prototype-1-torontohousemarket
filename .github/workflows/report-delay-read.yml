name: Read report delay history
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[report-delay-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read bounded historical runtime events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/80022b7ed0560b75d96cc593b0cfaf22/workers/observability/telemetry/query', {
            method:'POST', headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({queryId:'report-delay-review',dry:true,view:'events',limit:500,timeframe:{from:Date.parse('2026-09-22T20:33:00Z'),to:Date.parse('2026-09-22T20:40:00Z')},parameters:{datasets:[],filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'prototype-1-torontohousemarket'}]}}),
            signal:AbortSignal.timeout(30000)
          });
          const data=await response.json();
          console.log('query_status',response.status,'success',data.success,'result_keys',Object.keys(data.result||{}));
          if(!response.ok){console.log('error_codes',(data.errors||[]).map(e=>e.code));process.exit(0);}
          // Log only runtime diagnostics: never email recipients, addresses, tokens, or full events.
          const allowed=new Set(['timestamp','eventTimestamp','outcome','cpuTimeMs','cpuTime','wallTimeMs','wallTime','eventType','cron','event','stage','name','status','processing_ms','queue_wait_ms','request_count','attempt','started_ms','duration_ms']);
          function scrub(value){
            if(Array.isArray(value))return value.map(scrub).filter(x=>x!=null);
            if(!value||typeof value!=='object')return null;
            const out={};
            for(const [key,item]of Object.entries(value)){
              if(allowed.has(key)&&['string','number','boolean'].includes(typeof item))out[key]=item;
              else if(key==='message'&&typeof item==='string'){
                try{const obj=JSON.parse(item);if(obj.event)out.diagnostic=scrub(obj);}catch{if(/exceeded|CPU time|memory limit|exception|interrupted|timeout|time budget/i.test(item))out.runtime_message=item.replace(/https?:\/\/\S+/g,'[url]').slice(0,240);}
              }else if(item&&typeof item==='object'){const nested=scrub(item);if(nested&&Object.keys(nested).length)out[key]=nested;}
            }
            return Object.keys(out).length?out:null;
          }
          console.log('RUNTIME_HISTORY',JSON.stringify(scrub(data.result.events||data.result.invocations||{})));
          NODE
