name: Preview and publish THM 7.5 shared style
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-v75-style-guarded-deployment
  cancel-in-progress: false
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[v75-style-preview]') || contains(github.event.head_commit.message, '[v75-style-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify presentation scope and focused email regressions
        run: |
          node scripts/v75-style-scope.mjs
          node --check worker-v11.js
          node --test tests/offer-instructions.test.mjs tests/st-clair-address.test.mjs tests/interface-email.test.mjs tests/buyer-refinement.test.mjs tests/v74-email-retry.test.mjs tests/seller-slider-validation.test.mjs tests/form-validation.test.mjs
          node --test --test-name-pattern='buyer report email|email infographic|expanded-window|seller scenario' tests/email-copy.test.mjs tests/seller-flow.test.mjs
      - name: Check navigation and responsive buyer, seller and email layouts
        if: contains(github.event.head_commit.message, '[v75-style-preview]')
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps webkit
          node scripts/v75-navigation.mjs
          node scripts/v75-style-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[v75-style-preview]')
        with:
          name: v75-style-review
          path: mobile-qa/
      - name: Guarded preview or promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          CANDIDATE_VERSION_ID: 'a9d06533-8061-4d76-9ef6-504e15fdece6'
          EXPECTED_CANDIDATE_SHA: '5bcfa6b849e1dd926be7947a2ff602834f0541c0ba65ecc62d8fc2ee15ba5fa6'
          EXPECTED_ACTIVE_VERSION: 5778b355-72fc-4b5a-8ef4-91e4033c49d8
          EXPECTED_ACTIVE_SHA: 5530ff0ef9f69abc8eebd15c097d702521cd40f0dc6e7f34117679bf2585a94e
          PUBLISH: ${{ contains(github.event.head_commit.message, '[v75-style-release]') && 'true' || 'false' }}
        run: node scripts/v75-style-release.mjs
