name: Seller evidence preview
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-seller-preview
  cancel-in-progress: false
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[seller-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate focused seller changes
        run: |
          node --check worker-v11.js
          node --check seller.js
          node --check form-inputs.js
          node --check address-input.js
          node --check app.js
          node --test tests/seller-flow.test.mjs tests/email-copy.test.mjs tests/address-search.test.mjs tests/form-validation.test.mjs tests/address-autocomplete.test.mjs tests/listing-share.test.mjs
      - name: Prepare guarded preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_SHA: 15af5cc85d4544abd03ea9dbbf1891ef6415cb3e74ac992ce4cba311a42540da
          PREVIEW_ONLY: 'true'
        run: node .github/scripts/ten-property-audit.mjs
      - name: Verify preview assets and existing seller evidence
        env:
          THM_ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node .github/scripts/seller-preview-check.mjs
