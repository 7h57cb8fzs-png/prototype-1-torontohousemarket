name: Inspect address secret deployment
on:
  push:
    branches: [phase-6]
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-address]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read worker source only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: node .github/scripts/inspect-address-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-source-review
          path: production-worker-review.js
          retention-days: 1
