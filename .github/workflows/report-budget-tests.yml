name: Report request-budget regression tests
on:
  push:
    branches: ['fix/v73-request-budget']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report-budget-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v73-request-budget
      - name: Apply checked surgical patch
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false acorn@8.15.0
          node scripts/patch-report-budget.mjs
          node --check worker-v11.js
          node --check worker-v12.js
          node --check worker-v22.js
          node --check report-runtime.js
          git diff --check
      - name: Offline failure and isolation regression tests
        run: node --test tests/report-runtime.test.mjs
      - name: Save tested application code on repair branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/v73-request-budget'
          git add worker-v11.js worker-v12.js worker-v22.js
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git -c user.name='THM repair automation' -c user.email='actions@users.noreply.github.com' commit -m 'Fix request exhaustion: reuse VOW pool, reserve writes, finalize before ready'
          git push origin HEAD:fix/v73-request-budget
