name: Restore diagnostics-only Worker

on:
  push:
    branches:
      - fix/vow-comparable-engine
    paths:
      - .github/workflows/deploy-vow-diagnostic-console.yml

permissions:
  contents: read

jobs:
  deploy-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out forensic branch
        uses: actions/checkout@v4
        with:
          ref: fix/vow-comparable-engine

      - name: Validate diagnostics-only source
        run: |
          set -euo pipefail
          node --check worker-v11.js
          test "$(sha256sum worker-v11.js | cut -d' ' -f1)" = "96a31be076f9a9dc601ec46d79f7ba6835f7caf012a134ca15cf074f03ae34b8"
          grep -F 'comparable_selection_diagnostic' worker-v11.js >/dev/null
          grep -F 'ai_narrative_diagnostic' worker-v11.js >/dev/null
          grep -F 'report_generation_status' worker-v11.js >/dev/null

      - name: Deploy diagnostics and preserve production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          WORKER_NAME: prototype-1-torontohousemarket
          PRODUCTION_URL: https://torontohousemarket.com
          BEFORE_SHA256: 45bcce98958ba233363229f734f90fa6b5b3f018f1d899d34b1a12208d55dac5
          AFTER_SHA256: 96a31be076f9a9dc601ec46d79f7ba6835f7caf012a134ca15cf074f03ae34b8
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS -H "${auth}" -o "${work_dir}/deployments-before.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
          rollback_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-before.json" | head -1)"
          test -n "${rollback_id}"
          test "${rollback_id}" != "null"

          curl -fsS -H "${auth}" -o "${work_dir}/version-before.json" "${api}/workers/workers/${WORKER_NAME}/versions/${rollback_id}?include=modules"
          jq -r '.result.modules[] | select(.name == "worker-v11.js") | .content_base64' "${work_dir}/version-before.json" | base64 --decode > "${work_dir}/worker-before.js"
          test "$(sha256sum "${work_dir}/worker-before.js" | cut -d' ' -f1)" = "${BEFORE_SHA256}"

          curl -fsS -H "${auth}" -o "${work_dir}/settings-before.json" "${api}/workers/scripts/${WORKER_NAME}/settings"
          curl -fsS -H "${auth}" -o "${work_dir}/schedules-before.json" "${api}/workers/scripts/${WORKER_NAME}/schedules"
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' "${work_dir}/version-before.json" > "${work_dir}/bindings-before.json"
          jq -S '.result' "${work_dir}/schedules-before.json" > "${work_dir}/schedules-before-normalized.json"

          rollback() {
            jq -n --arg version_id "${rollback_id}" '{strategy:"percentage",versions:[{percentage:100,version_id:$version_id}],annotations:{"workers/message":"Automatic rollback after diagnostics-only verification failure"}}' > "${work_dir}/rollback.json"
            curl -sS --request POST -H "${auth}" -H 'Content-Type: application/json' --data-binary @"${work_dir}/rollback.json" "${api}/workers/scripts/${WORKER_NAME}/deployments" >/dev/null || true
          }
          trap 'status=$?; if [ "${status}" -ne 0 ]; then rollback; fi; rm -rf "${work_dir}"' EXIT

          status="$(curl -sS --request PUT -H "${auth}" -H 'CF-WORKER-MAIN-MODULE-PART: worker-v11.js' -F 'metadata={"main_module":"worker-v11.js"};type=application/json' -F 'worker-v11.js=@worker-v11.js;type=application/javascript+module' -o "${work_dir}/content-update.json" -w '%{http_code}' "${api}/workers/scripts/${WORKER_NAME}/content")"
          test "${status}" -ge 200
          test "${status}" -lt 300

          curl -fsS -H "${auth}" -o "${work_dir}/deployments-mid.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
          temporary_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-mid.json" | head -1)"
          curl -fsS -H "${auth}" -o "${work_dir}/version-mid.json" "${api}/workers/workers/${WORKER_NAME}/versions/${temporary_id}"
          jq -S '[.result.bindings[] | select(.type != "plain_text") | {name, type}] | sort_by(.name)' "${work_dir}/version-before.json" > "${work_dir}/protected-before.json"
          jq -S '[.result.bindings[] | select(.type != "plain_text") | {name, type}] | sort_by(.name)' "${work_dir}/version-mid.json" > "${work_dir}/protected-mid.json"
          cmp "${work_dir}/protected-before.json" "${work_dir}/protected-mid.json"

          jq '.result as $s | {annotations:{"workers/message":"Diagnostics-only comparable and AI observability","workers/tag":"diagnostics-only-20260904"},bindings:[inputs.result.bindings[] | if (.type == "plain_text" or .type == "json") then . else {name:.name,type:"inherit",version_id:"latest"} end],compatibility_date:$s.compatibility_date,compatibility_flags:($s.compatibility_flags // []),usage_model:$s.usage_model,limits:$s.limits,observability:$s.observability,placement:$s.placement,cache_options:$s.cache_options,tail_consumers:$s.tail_consumers,logpush:$s.logpush} | with_entries(select(.value != null))' "${work_dir}/settings-before.json" "${work_dir}/version-before.json" > "${work_dir}/settings-patch.json"

          status="$(curl -sS --request PATCH -H "${auth}" -F 'settings=@'"${work_dir}"'/settings-patch.json;type=application/json' -o "${work_dir}/settings-response.json" -w '%{http_code}' "${api}/workers/scripts/${WORKER_NAME}/settings")"
          test "${status}" -ge 200
          test "${status}" -lt 300
          jq -e '.success == true' "${work_dir}/settings-response.json" >/dev/null

          curl -fsS -H "${auth}" -o "${work_dir}/deployments-after.json" "${api}/workers/scripts/${WORKER_NAME}/deployments"
          active_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' "${work_dir}/deployments-after.json" | head -1)"
          test -n "${active_id}"
          test "${active_id}" != "${rollback_id}"
          curl -fsS -H "${auth}" -o "${work_dir}/version-after.json" "${api}/workers/workers/${WORKER_NAME}/versions/${active_id}?include=modules"
          jq -r '.result.modules[] | select(.name == "worker-v11.js") | .content_base64' "${work_dir}/version-after.json" | base64 --decode > "${work_dir}/worker-after.js"
          test "$(sha256sum "${work_dir}/worker-after.js" | cut -d' ' -f1)" = "${AFTER_SHA256}"
          jq -S '[.result.bindings[] | {name, type}] | sort_by(.name)' "${work_dir}/version-after.json" > "${work_dir}/bindings-after.json"
          cmp "${work_dir}/bindings-before.json" "${work_dir}/bindings-after.json"

          curl -fsS -H "${auth}" -o "${work_dir}/schedules-after.json" "${api}/workers/scripts/${WORKER_NAME}/schedules"
          jq -S '.result' "${work_dir}/schedules-after.json" > "${work_dir}/schedules-after-normalized.json"
          cmp "${work_dir}/schedules-before-normalized.json" "${work_dir}/schedules-after-normalized.json"
          curl -fsS "${PRODUCTION_URL}/api/version" | jq -e '.version == "stage4-vow-dynamic-window-copy-v99-20260903"' >/dev/null

          trap - EXIT
          rm -rf "${work_dir}"
          echo "Diagnostics-only Worker source verified. No automation endpoint was called."
