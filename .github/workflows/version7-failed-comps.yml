name: Version 7 failed-comparable regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/version7-failed-comps.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview config
        run: |
          set -euo pipefail
          node --check worker-v11.js
          node --check worker-v12.js
          node --check worker-v13.js
          node --check worker-v14.js
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          delete cfg.secrets;
          fs.writeFileSync('wrangler.preview.json',JSON.stringify(cfg,null,2));
          NODE
      - name: Upload isolated Version 7 preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 versions upload --config wrangler.preview.json --preview-alias v7-failed-comps --keep-vars | tee preview.log
          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' preview.log | tail -1)"
          if [ -z "$url" ]; then
            echo '::error::Preview URL not found.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Run only the four prior failed comparable cases
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p v7-regression
          for case_id in davos donnacona lindbergh bloomgate; do
            echo "Testing ${case_id}..."
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS --max-time 90 "${PREVIEW_URL}/api/internal/v7-failed-comp-regression?case=${case_id}" -o "v7-regression/${case_id}.json"
            jq -e '.ok == true and .subjectResolved == true and .expertUsed == true' "v7-regression/${case_id}.json" >/dev/null
            jq '{case,address,subjectType,subjectCommunity,subjectSize,candidateCount,expertUsed,selectedCount,valuationRecoverable,confidence,externalSearchWouldRun,selectedSummary,note}' "v7-regression/${case_id}.json"
          done
          jq -s '.' v7-regression/*.json > v7-regression/results.json
          echo '### Version 7 focused failed-comparable regression' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Case | Candidates | Expert comps | Recoverable | Confidence | External next? |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "| \(.case) | \(.candidateCount) | \(.selectedCount) | \(.valuationRecoverable) | \(.confidence) | \(.externalSearchWouldRun) |"' v7-regression/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the four historical insufficient-comparable cases were tested. No lead, email, or customer record was created.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version7-failed-comparable-results
          path: v7-regression/
          if-no-files-found: warn
          retention-days: 3
