name: THM customized seller presentation
on:
  push:
    branches: [feature/postgrid-test-20261005]
permissions:
  contents: read
concurrency:
  group: thm-postgrid-test
  cancel-in-progress: false
jobs:
  presentation:
    if: "contains(github.event.head_commit.message, '[presentation-')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/postgrid-inspect.mjs
      - name: Verify read-only report generation with MLS data
        if: "contains(github.event.head_commit.message, '[presentation-probe]')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/presentation-runtime-test.mjs
