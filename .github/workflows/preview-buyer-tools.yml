name: Preview buyer tools without production deployment
on:
  push:
    branches: [feature/buyer-tools-ai-20260906]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate combined changes
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Upload version and verify live public features
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_SHA: 5cd7ea1b2b6b650547b6bc03ae263ba164dcea11d74bb2fb38f36e0df73f4f59
        run: node .github/scripts/preview-buyer-tools.mjs
