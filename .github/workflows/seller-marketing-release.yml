name: Verify and publish seller marketing
on:
  push:
    branches: [feature/seller-marketing-phase6-20260923, phase-6]
permissions:
  contents: read
concurrency:
  group: thm-v75-style-guarded-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[marketing-preview]') || contains(github.event.head_commit.message, '[marketing-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated marketing scope and existing flows
        run: |
          node scripts/seller-marketing-scope.mjs
          node --check seller-marketing.js
          node --check worker-v11.js
          node --check worker-v22.js
          node --test tests/seller-marketing.test.mjs tests/v74-email-retry.test.mjs tests/admin-workspace.test.mjs tests/seller-slider-validation.test.mjs tests/form-validation.test.mjs
      - name: Prepare or publish verified seller marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_VERSION: beed29ff-b1ce-450f-8b6e-26459bc17820
          EXPECTED_ACTIVE_SHA: d578cbbba133acf0130bf2fc76e777b93e368c5a20ba39749ee797aca2a2356e
          CANDIDATE_VERSION_ID: '0666a0bf-3900-445b-b57d-97ed18673402'
          EXPECTED_CANDIDATE_SHA: '5ad6140a8c9d4aad9587c408ab3209adf107bf90615fe0dd4dfb3cec7e3256b7'
          PUBLISH: ${{ contains(github.event.head_commit.message, '[marketing-release]') && 'true' || 'false' }}
        run: node scripts/seller-marketing-release.mjs
