name: Howland Luna to Terra comparison

on:
  push:
    branches: [main]
    paths:
      - 'worker-v17-hybrid-howland-test.js'
      - '.github/workflows/howland-luna-terra-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate test worker
        run: node --check worker-v17-hybrid-howland-test.js
      - name: Prepare isolated preview config
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.main='worker-v17-hybrid-howland-test.js';
          delete cfg.secrets;
          delete cfg.triggers;
          fs.writeFileSync('wrangler.howland-test.json',JSON.stringify(cfg,null,2));
          NODE
      - name: Upload isolated preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 versions upload --config wrangler.howland-test.json --preview-alias howland-hybrid --keep-vars | tee preview.log
          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Run one Terra final-reconciliation call
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          curl --retry 2 --retry-all-errors --retry-delay 2 -fsS --max-time 90 "${PREVIEW_URL}/compare" -o howland-hybrid-result.json
          jq -e '.ok == true' howland-hybrid-result.json >/dev/null
          cat howland-hybrid-result.json | jq .
          echo '### 261 Howland: Luna shortlist → Terra final' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Luna only: $\(.lunaBaseline.low)–$\(.lunaBaseline.high), midpoint $\(.lunaBaseline.midpoint)"' howland-hybrid-result.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Hybrid: $\(.hybrid.low)–$\(.hybrid.high), midpoint $\(.hybrid.midpoint), confidence \(.hybrid.confidence)"' howland-hybrid-result.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Difference: low \(.difference.low), midpoint \(.difference.midpoint), high \(.difference.high), midpoint \(.difference.midpointPct)%"' howland-hybrid-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison result
        uses: actions/upload-artifact@v4
        with:
          name: howland-luna-terra-comparison
          path: howland-hybrid-result.json
          retention-days: 3
