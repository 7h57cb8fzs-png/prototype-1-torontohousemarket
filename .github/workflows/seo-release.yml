name: THM focused SEO release
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-seo-release
  cancel-in-progress: false
jobs:
  seo:
    if: contains(github.event.head_commit.message, '[thm-seo-preview]') || contains(github.event.head_commit.message, '[thm-seo-publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SEO and preserve the deployed application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          CANDIDATE_VERSION_ID: ''
          CANDIDATE_PREVIEW_URL: ''
          PUBLISH: ${{ contains(github.event.head_commit.message, '[thm-seo-publish]') && 'true' || 'false' }}
        run: node scripts/seo-release.mjs
