name: Verify Luna outside-source fallback without emails
on:
  push:
    branches: [fix/luna-external-fallback-20260927]
    paths: [.github/workflows/external-qa.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify comparable and history safeguards
        run: node --test tests/external-comps.test.mjs tests/lookup-history.test.mjs tests/seller-mls-only.test.mjs tests/seller-v73-policy.test.mjs
      - name: Compare 10 new random off-market seller and 10 new random buyer reports
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_VERSION: 52c942f2-2042-4d77-89e9-8c99ced92c2b
          EXPECTED_ACTIVE_SHA: 4effeb70717cacb558e3e9d9c471d12698bdabf964d647c7a25e142ab49aa904
        run: node scripts/external-qa.mjs
