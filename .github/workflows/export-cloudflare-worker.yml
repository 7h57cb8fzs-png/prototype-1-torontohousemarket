name: Export deployed Cloudflare Worker

on:
  push:
    branches:
      - codex/fix-complete-ai-report
    paths:
      - .github/workflows/export-cloudflare-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export deployed worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          WORKER_NAME: toronto-house-market
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          mkdir -p exported-worker
          printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" > exported-worker/account-id.txt
          printf '%s' "${WORKER_NAME}" > exported-worker/worker-name.txt
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -D exported-worker/response-headers.txt \
            -o exported-worker/worker-bundle.bin \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" \
            -o exported-worker/settings.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
      - name: Upload deployed worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: toronto-house-market-deployed
          path: exported-worker/
          if-no-files-found: error
          retention-days: 1
