name: Recover and patch active production Worker

on:
  push:
    branches:
      - codex/fix-complete-ai-report
    paths:
      - .github/workflows/export-cloudflare-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-complete-ai-report

      - name: Recover active Worker and apply v85 comparable patch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          WORKER_NAME: prototype-1-torontohousemarket
        run: |
          set -euo pipefail
          mkdir -p active-worker
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o active-worker/deployments.json "${api}/workers/scripts/${WORKER_NAME}/deployments"
          version_id="$(jq -r '.result.deployments[0].versions[] | select(.percentage == 100) | .version_id' active-worker/deployments.json | head -1)"
          if [ -z "${version_id}" ] || [ "${version_id}" = "null" ]; then
            echo "::error::No active 100% Worker version was found."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o active-worker/version.json "${api}/workers/workers/${WORKER_NAME}/versions/${version_id}?include=modules"
          jq -e '.success == true and (.result.modules | length) > 0' active-worker/version.json >/dev/null
          jq -r '.result.modules[] | select(.name == "worker-v11.js") | .content_base64' active-worker/version.json | base64 --decode > active-worker/worker-v11.js
          test -s active-worker/worker-v11.js
          node scripts/recover-and-patch-production-worker.mjs active-worker/worker-v11.js production-patches/v85-comparables-block.js.txt worker-v11.js
          node --check worker-v11.js

      - name: Commit recovered v85 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-v11.js
          if git diff --cached --quiet; then
            echo "worker-v11.js is already current."
            exit 0
          fi
          git commit -m "Recover production Worker and apply v85 sold comparables fix"
          git push origin HEAD:codex/fix-complete-ai-report

      - name: Upload recovered source for audit
        uses: actions/upload-artifact@v4
        with:
          name: recovered-production-worker-v85
          path: worker-v11.js
          if-no-files-found: error
          retention-days: 3
