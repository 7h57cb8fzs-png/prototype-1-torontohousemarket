name: Publish verified conditional Luna outside search
on:
  push:
    branches: [fix/luna-external-fallback-20260927]
    paths: [.github/workflows/external-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify report safeguards
        run: node --test tests/external-comps.test.mjs tests/lookup-history.test.mjs tests/seller-mls-only.test.mjs tests/seller-v73-policy.test.mjs tests/report-runtime.test.mjs
      - name: Promote reviewed version and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_VERSION: 52c942f2-2042-4d77-89e9-8c99ced92c2b
          EXPECTED_ACTIVE_SHA: 4effeb70717cacb558e3e9d9c471d12698bdabf964d647c7a25e142ab49aa904
          CANDIDATE_VERSION_ID: 0ee2f48d-a4b5-47f3-aec6-8b3c92edab58
          CANDIDATE_PREVIEW_URL: https://0ee2f48d-prototype-1-torontohousemarket.7h57cb8fzs.workers.dev
          EXPECTED_CANDIDATE_SHA: b654b801ed955bca1e682d5b0f111c7dd27f099c0e2dfbf785d2b15b88325e74
          PUBLISH: 'true'
        run: node scripts/external-publish.mjs
