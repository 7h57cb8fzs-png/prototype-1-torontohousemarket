name: Inspect requested MLS lookups
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[listing-lookup-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect feeds through an authenticated unpublished preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: node scripts/listing-lookup-read.mjs
