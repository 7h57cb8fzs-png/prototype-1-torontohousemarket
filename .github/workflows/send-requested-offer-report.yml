name: Send requested offer-date report
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
jobs:
  send:
    if: contains(github.event.head_commit.message, '[send-N13816518]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send one report to the verified requesting user
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_VERSION: a9d06533-8061-4d76-9ef6-504e15fdece6
        run: node scripts/send-requested-offer-report.mjs
