name: Version 7.1 random GTA QA preview

on:
  push:
    branches: [main]
    paths:
      - 'worker-v18-qa.js'
      - 'worker-v19-qa.js'
      - '.github/workflows/v71-random-qa-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated preview config
        run: |
          set -euo pipefail
          node --check worker-v18-qa.js
          node --check worker-v19-qa.js
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.main='worker-v19-qa.js';
          delete cfg.secrets;
          fs.writeFileSync('wrangler.qa-preview.json',JSON.stringify(cfg,null,2));
          NODE
      - name: Upload isolated QA preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 versions upload --config wrangler.qa-preview.json --preview-alias v71-random-qa --keep-vars | tee preview.log
          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Select 10 listings and run reports
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p v71-random-qa
          curl -sS --max-time 180 "${PREVIEW_URL}/api/internal/v71-random-qa-select" -o v71-random-qa/selection.json
          cat v71-random-qa/selection.json
          jq -e '.ok == true and .count == 10' v71-random-qa/selection.json >/dev/null
          jq -r '.listings[].listingKey' v71-random-qa/selection.json | while read key; do
            echo "Running ${key}..."
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS --max-time 120 "${PREVIEW_URL}/api/internal/v71-random-qa-report?listingKey=${key}" -o "v71-random-qa/${key}.json"
            jq -e '.ok == true' "v71-random-qa/${key}.json" >/dev/null
          done
          jq -s '.' v71-random-qa/*.json > v71-random-qa/all.json
          for f in v71-random-qa/*.json; do [ "$(basename "$f")" = selection.json ] && continue; [ "$(basename "$f")" = all.json ] && continue; jq '{address,category,propertyType,listPrice,beds,baths,size,candidateCount,selectedCount,confidence,valuation,marketRead,buyerStrategy,comparables}' "$f"; done
      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v71-random-qa-preview-results
          path: v71-random-qa/
          if-no-files-found: warn
          retention-days: 3
