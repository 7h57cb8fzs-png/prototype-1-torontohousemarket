name: Version 7.2 validation
on:
  push:
    branches: [phase-7-2]
    paths: ['worker-v20.js','wrangler.jsonc','.github/workflows/version72-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V7.2 source
        run: |
          set -euo pipefail
          node --check worker-v20.js
          grep -F 'Estimated Market Value' worker-v20.js >/dev/null
          grep -F 'exceptionally complex' worker-v20.js >/dev/null
          grep -F 'worker-v20.js' wrangler.jsonc >/dev/null
      - name: Prepare preview config
        run: |
          node <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); delete c.secrets; fs.writeFileSync('wrangler.v72.json',JSON.stringify(c,null,2));
          NODE
      - name: Upload isolated V7.2 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: npx --yes wrangler@4.129.0 versions upload --config wrangler.v72.json --preview-alias v72-review --keep-vars
