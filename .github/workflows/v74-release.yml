name: Preview and publish THM 7.4
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-v74-guarded-deployment
  cancel-in-progress: false
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[v74-preview]') || contains(github.event.head_commit.message, '[v74-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused acceptance
        run: |
          node --check worker-v11.js
          node --check worker-v12.js
          node --check worker-v22.js
          node --check app.js
          node --check home-chat.js
          node --check admin.js
          node --test --test-name-pattern='studio |condo sizes require|front-page condos exclude' tests/studio-price-check.test.mjs tests/buyer-refinement.test.mjs
      - name: Guarded preview or promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          CANDIDATE_VERSION_ID: ${{ contains(github.event.head_commit.message, '[v74-release]') && '74e87ed8-2067-48dc-b256-104b54bf2bf2' || '' }}
          EXPECTED_ACTIVE_VERSION: fea0845a-f86e-41c8-82eb-ce4e34d5c686
          EXPECTED_ACTIVE_SHA: b3e54bdabc655d551798a1ff27cc09ec42472f627bf03f0be5b0cc26c50424cd
          PUBLISH: ${{ contains(github.event.head_commit.message, '[v74-release]') && 'true' || 'false' }}
        run: node scripts/v74-release.mjs
