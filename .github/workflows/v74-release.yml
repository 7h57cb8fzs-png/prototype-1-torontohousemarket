name: Preview and publish THM 7.4
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-v74-guarded-deployment
  cancel-in-progress: false
jobs:
  preview:
    if: contains(github.event.head_commit.message, '[v74-preview]') || contains(github.event.head_commit.message, '[v74-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused acceptance
        run: |
          node --check worker-v11.js
          node --check worker-v12.js
          node --check worker-v22.js
          node --check app.js
          node --check home-chat.js
          node --check admin.js
          node --test tests/mls-photos.test.mjs
      - name: Guarded preview or promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          CANDIDATE_VERSION_ID: ${{ contains(github.event.head_commit.message, '[v74-release]') && '56eee888-9145-4392-b6c6-b25830f24d1f' || '' }}
          EXPECTED_ACTIVE_SHA: 9c4a739ec98410a4a25c9b73f105cb735794329e675b9252013d9caff4027a82
          PUBLISH: ${{ contains(github.event.head_commit.message, '[v74-release]') && 'true' || 'false' }}
        run: node scripts/v74-release.mjs
