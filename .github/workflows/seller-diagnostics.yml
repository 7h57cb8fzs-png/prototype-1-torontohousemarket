name: Seller request diagnostics
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
jobs:
  diagnostics:
    if: contains(github.event.head_commit.message, '[seller-tail]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe sanitized seller request outcomes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
        run: node .github/scripts/seller-diagnostics.mjs
