name: Ten property reliability audit
on:
  push:
    branches: [fix/ten-property-reliability-20260906]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate report and website behaviour
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Prepare isolated preview and random public property sample
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_ACTIVE_SHA: b8f05b41f3e442b7b1fdfcf3ef065957e0afab490af9d2e14e9cae2f24ce609c
        run: node .github/scripts/ten-property-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten-property-public-audit
          path: audit-output/
          retention-days: 7
