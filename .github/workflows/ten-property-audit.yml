name: Restore requested website version
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  restore:
    if: contains(github.event.head_commit.message, '[restore-pre-request]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified pre-request deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/restore-pre-request.mjs
