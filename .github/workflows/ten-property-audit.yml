name: Ten property reliability audit
on:
  push:
    branches: [fix/ten-property-reliability-20260906]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate report and website behaviour
        run: |
          node --check worker-v11.js
          node --check app.js
          node --test tests/*.test.mjs
      - name: Promote verified report audit with rollback guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          CANDIDATE_VERSION_ID: 47f9fc75-9912-46c7-946f-e6eca6b204fd
          EXPECTED_BEFORE_SHA: b8f05b41f3e442b7b1fdfcf3ef065957e0afab490af9d2e14e9cae2f24ce609c
        run: node .github/scripts/promote-buyer-tools.mjs
