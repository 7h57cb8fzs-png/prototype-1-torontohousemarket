name: Focused property release check
on:
  push:
    branches: [fix/ten-property-reliability-20260906]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search ten previously untested condos (no deployment or emails)
        run: node .github/scripts/condo-address-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: condo-address-results
          path: audit-output/condo-address-results.json
