name: Focused property release check
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --test tests/freehold-bedrooms.test.mjs
      - name: Prepare verified preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          PREVIEW_ONLY: "true"
          EXPECTED_ACTIVE_SHA: ed36c246e3a815b57c9640ef66d12ffb7de032b3a7886493d09dda788281b561
        run: node .github/scripts/ten-property-audit.mjs
      - name: Promote verified report path fix with rollback guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: ed36c246e3a815b57c9640ef66d12ffb7de032b3a7886493d09dda788281b561
        run: |
          node --input-type=module -e 'import fs from "node:fs"; process.env.CANDIDATE_VERSION_ID=JSON.parse(fs.readFileSync("audit-output/release.json")).candidate; await import("./.github/scripts/promote-buyer-tools.mjs");'
