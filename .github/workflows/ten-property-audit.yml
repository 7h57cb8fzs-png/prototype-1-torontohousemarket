name: Ten property reliability audit
on:
  push:
    branches: [fix/ten-property-reliability-20260906]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate evidence path and report behavior
        run: node --test tests/*.test.mjs
      - name: Prepare verified preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          PREVIEW_ONLY: "true"
          EXPECTED_ACTIVE_SHA: c008fec8177df0c5ac18399094cc7d4f10e48b08b6c5b2928b94c42dbf6180e8
        run: node .github/scripts/ten-property-audit.mjs
      - name: Promote verified report path fix with rollback guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: c008fec8177df0c5ac18399094cc7d4f10e48b08b6c5b2928b94c42dbf6180e8
        run: |
          node --input-type=module -e 'import fs from "node:fs"; process.env.CANDIDATE_VERSION_ID=JSON.parse(fs.readFileSync("audit-output/release.json")).candidate; await import("./.github/scripts/promote-buyer-tools.mjs");'
