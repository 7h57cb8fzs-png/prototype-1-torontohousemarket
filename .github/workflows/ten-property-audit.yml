name: Focused property release check
on:
  push:
    branches: [phase-6]
permissions:
  contents: read
concurrency:
  group: thm-guarded-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check seller.js
          node --check admin.js
          node --check worker-v11.js
          node --test tests/seller-flow.test.mjs
      - name: Prepare verified preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          PREVIEW_ONLY: "true"
          EXPECTED_ACTIVE_SHA: e38a0db131dce5741c25b30b28285bc3c0af3d56977e8ff4005f84c07badae1e
        run: node .github/scripts/ten-property-audit.mjs
      - name: Promote verified seller flow with rollback guards
        if: contains(github.event.head_commit.message, '[release]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 80022b7ed0560b75d96cc593b0cfaf22
          EXPECTED_BEFORE_SHA: e38a0db131dce5741c25b30b28285bc3c0af3d56977e8ff4005f84c07badae1e
        run: |
          node --input-type=module -e 'import fs from "node:fs"; process.env.CANDIDATE_VERSION_ID=JSON.parse(fs.readFileSync("audit-output/release.json")).candidate; await import("./.github/scripts/promote-buyer-tools.mjs");'
